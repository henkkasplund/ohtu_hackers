<h1>Muokkaa viitettä</h1>

<form action="/edit_reference" method="GET">
  <label for="style">Viitetyyli:</label>
  <select id="style" name="style" required>
    <option value="" disabled {% if not selected_style %}selected{% endif %}>Valitse viitetyyli...</option>
    {% for type in reference_types %}
      <option value="{{ type.name }}" {% if selected_style == type.name %}selected{% endif %}>
        {{ type.name }}
      </option>
    {% endfor %}
  </select>
  <button type="submit">Valitse</button>
</form>

<hr>

{% if selected_style == "Kirja" %}
  <form action="/references/{{ reference.citation_id }}/edit_reference" method="POST">
    <input type="hidden" name="reference_types_name" value="{{ selected_style }}">

    <div>
      <label for="citation_key">Viiteavain (esim. Martin09):</label>
      <input type="text" id="citation_key" name="citation_key" value="{{ reference.citation_key }}" required>
    </div>

    <div>
      <label for="author">Tekijä (Author):</label>
      <input type="text" id="author" name="author" value="{{ reference.author }}" required>
    </div>

    <div>
      <label for="title">Otsikko (Title):</label>
      <input type="text" id="title" name="title" value="{{ reference.title }}" required>
    </div>

    <div>
      <label for="year">Vuosi (Year):</label>
      <input type="text" id="year" name="year" value="{{ reference.year }}" pattern="[0-9]{4}" title="Syötä vuosiluku numeroina (esim. 2000)" required>
    </div>

    <div>
      <label for="publisher">Kustantaja (Publisher):</label>
      <input type="text" id="publisher" name="publisher" value="{{ reference.publisher or '' }}" required>
    </div>

    <button type="submit">Muokkaa kirja</button>
  </form>
{% endif %}
<p><a href="/">Takaisin etusivulle</a></p>
