<h1>Lisää viite</h1>

<!-- 1. Vaihe: Tyylin valinta (GET-pyyntö samalle sivulle) -->
<form action="/add_reference" method="GET">
  <label for="style">Viitetyyli:</label>
  <select id="style" name="style" required>
    <option value="" disabled {% if not selected_style %}selected{% endif %}>Valitse viitetyyli...</option>
    {% for style in citation_styles %}
      <option value="{{ style.name }}" {% if selected_style == style.name %}selected{% endif %}>
        {{ style.name }}
      </option>
    {% endfor %}
  </select>
  <button type="submit">Valitse</button>
</form>

<hr>

<!-- 2. Vaihe: Varsinainen lomake näkyy vasta, kun tyyli on valittu -->
{% if selected_style == "Kirja" %}
  <form action="/add_reference" method="POST">
    <input type="hidden" name="citation_style_name" value="{{ selected_style }}">

    <div>
      <label for="citation_key">Viiteavain (esim. Martin09):</label>
      <input type="text" id="citation_key" name="citation_key" required>
    </div>

    <div>
      <label for="author">Tekijä (Author):</label>
      <input type="text" id="author" name="author" required>
    </div>

    <div>
      <label for="title">Otsikko (Title):</label>
      <input type="text" id="title" name="title" required>
    </div>

    <div>
      <label for="year">Vuosi (Year):</label>
      <input type="number" id="year" name="year" required>
    </div>

    <div>
      <label for="publisher">Kustantaja (Publisher):</label>
      <input type="text" id="publisher" name="publisher" required>
    </div>

    <button type="submit">Tallenna kirja</button>
  </form>
{% endif %}
