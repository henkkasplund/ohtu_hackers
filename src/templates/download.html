{% extends "layout.html" %}

{% block title %}
    Lataa viitteet
{% endblock %}

{% block body %}
    <h1>Lataa viitteet</h1>

    {% if bibtex %}
        <p><a href="/download/references.bib" class="btn">Lataa BibTeX-tiedosto</a></p>
        {% for b in bibtex %}
            <pre>{{ b }}</pre>
        {% endfor %}
    {% else %}
        <p>Ei tallennettuja viitteitä.</p>
    {% endif %}
{% endblock %}
